[project]
name = "shortcuts"
version = "0.1.0"
description = "Dotfile keybinding cheatsheet"
requires-python = ">=3.12"
dependencies = []

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

# Single-module project: ship shortcuts.py as a top-level module.
[tool.hatch.build.targets.wheel]
include = ["shortcuts.py"]
