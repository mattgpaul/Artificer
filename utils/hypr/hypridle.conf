general {
    lock_cmd = pidof hyprlock || hyprlock
    before_sleep_cmd = loginctl lock-session
    after_sleep_cmd = hyprctl dispatch dpms on
}

listener {
    timeout = 300
    on-timeout = loginctl lock-session
}

listener {
    timeout = 330
    on-timeout = hyprctl dispatch dpms off
    on-resume = hyprctl dispatch dpms on
}

# Hibernate after 1h idle instead of suspending. Plain S3 suspend still drains
# the battery, which is what killed swordfish over a weekend; hibernate powers
# fully off (resumes from the encrypted swapfile — see hosts/INSTALL-luks.md).
listener {
    timeout = 3600
    on-timeout = systemctl hibernate
}
